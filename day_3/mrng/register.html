<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registration Form</title>
    </head>
    <body>
        <main>
            <h1>Register</h1>

            <form action="#" method="post" enctype="multipart/form-data">

                <fieldset>
                    <legend>Personal Details</legend>

                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name"
                        minlength="2" maxlength="50"
                        pattern="[A-Za-z ]+" required>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email"
                        autocomplete="email" required>

                    <label for="phone">Phone:</label>
                    <input type="tel" id="phone" name="phone"
                        pattern="[0-9]{10}" maxlength="10"
                        required>

                    <label for="birth-date">Date of Birth:</label>
                    <input type="date" id="birth-date" name="birth-date">

                    <label for="website">Website:</label>
                    <input type="url" id="website" name="website">
                </fieldset>

                <fieldset>
                    <legend>Account</legend>

                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username"
                        pattern="[A-Za-z0-9_.]{3,20}"
                        minlength="3" maxlength="20"
                        autocomplete="username" required>

                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password"
                        minlength="8" maxlength="30"
                        autocomplete="new-password" required>

                    <label for="confirm-password">Confirm Password:</label>
                    <input type="password" id="confirm-password"
                        name="confirm-password"
                        minlength="8" maxlength="30" required>

                    <label for="job-title">Job Title:</label>
                    <input type="text" id="job-title" name="job-title"
                        list="job-titles" required>
                    <datalist id="job-titles">
                        <option value="Software Developer">
                        <option value="Web Developer">
                        <option value="Data Analyst">
                        <option value="Data Scientist">
                        <option value="AI Engineer">
                        <option value="UI/UX Designer">
                        <option value="Project Manager">
                        <option value="Marketing Executive">
                    </datalist>

                    <label for="resume">Upload Resume:</label>
                    <input type="file" id="resume" name="resume"
                        accept=".pdf,.doc,.docx">

                </fieldset>


                <fieldset>
                    <legend>Preferences</legend>

                    <p>Receive notifications?</p>

                    <input type="radio" id="notify-yes" name="notifications"
                        value="yes" required>
                    <label for="notify-yes">Yes</label>

                    <input type="radio" id="notify-no" name="notifications"
                        value="no">
                    <label for="notify-no">No</label>

                    <label for="skill-level">Skill Level (1–10):</label>
                    <input type="range" id="skill-level" name="skill-level"
                        min="1" max="10">

                    <label for="profile-color">Profile Colour:</label>
                    <input type="color" id="profile-color"
                        name="profile-color">

                    <label for="experience">Years of Experience:</label>
                    <input type="number" id="experience" name="experience"
                        min="0" max="50">

                    <label for="preferred-time">Preferred Contact Time:</label>
                    <input type="time" id="preferred-time"
                        name="preferred-time">

                    <label for="appointment">Appointment Date and Time:</label>
                    <input type="datetime-local" id="appointment"
                        name="appointment">

                    <label for="start-month">Starting Month:</label>
                    <input type="month" id="start-month" name="start-month">

                    <label for="start-week">Starting Week:</label>
                    <input type="week" id="start-week" name="start-week">

                    <input type="checkbox" id="terms" name="terms"
                        value="accepted" required>
                    <label for="terms">I agree to the terms and conditions</label>
                </fieldset>

                <button type="submit">Register</button>
                <button type="reset">Reset</button>

            </form>
        </main>
    </body>
</html>
