<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Checkout Form</title>
    </head>
    <body>
        <main>
            <h1>Checkout</h1>
            <legend>Fields marked * are required</legend>

            <form action="#" method="post">

                <fieldset>
                    <legend>Delivery Address</legend>

                    <label for="full-name">Full Name: *</label>
                    <input type="text" id="full-name" name="full-name" required>

                    <label for="address1">Address Line 1: *</label>
                    <input type="text" id="address1" name="address1" required>

                    <label for="address2">Address Line 2:</label>
                    <input type="text" id="address2" name="address2">                    

                    <label for="city">City: *</label>
                    <input type="text" id="city" name="city" required>                    

                    <label for="postcode">Postcode: *</label>
                    <input type="text" id="postcode" name="postcode" required>                   

                    <label for="country">Country: *</label>
                    <select id="country" name="country" required>
                        <option value="">Select a country</option>
                        <option value="India">India</option>
                        <option value="United States">United States</option>
                        <option value="United Kingdom">United Kingdom</option>
                        <option value="Canada">Canada</option>
                        <option value="Australia">Australia</option>
                        <option value="New Zealand">New Zealand</option>
                        <option value="Germany">Germany</option>
                        <option value="France">France</option>
                        <option value="Italy">Italy</option>
                        <option value="Spain">Spain</option>
                        <option value="Portugal">Portugal</option>
                        <option value="Netherlands">Netherlands</option>
                        <option value="Switzerland">Switzerland</option>
                        <option value="Japan">Japan</option>
                        <option value="China">China</option>
                        <option value="South Korea">South Korea</option>
                        <option value="Singapore">Singapore</option>
                        <option value="Malaysia">Malaysia</option>
                        <option value="Thailand">Thailand</option>
                        <option value="Indonesia">Indonesia</option>
                        <option value="Brazil">Brazil</option>
                        <option value="South Africa">South Africa</option>
                        <option value="United Arab Emirates">United Arab Emirates</option>
                    </select>
                    
                </fieldset>               

                <fieldset>
                    <legend>Payment Details</legend>

                    <label for="card-number">Card Number: *</label>
                    <input type="text" id="card-number" name="card-number"
                        maxlength="16" pattern="[0-9]{16}"
                        inputmode="numeric" required>                   

                    <label for="expiry-month">Expiry Month: *</label>
                    <select id="expiry-month" name="expiry-month" required>
                        <option value="">Select month</option>
                        <option value="01">January</option>
                        <option value="02">February</option>
                        <option value="03">March</option>
                        <option value="04">April</option>
                        <option value="05">May</option>
                        <option value="06">June</option>
                        <option value="07">July</option>
                        <option value="08">August</option>
                        <option value="09">September</option>
                        <option value="10">October</option>
                        <option value="11">November</option>
                        <option value="12">December</option>
                    </select>                  

                    <label for="expiry-year">Expiry Year: *</label>
                    <select id="expiry-year" name="expiry-year" required>
                        <option value="">Select year</option>
                        <option value="2026">2026</option>
                        <option value="2027">2027</option>
                        <option value="2028">2028</option>
                        <option value="2029">2029</option>
                        <option value="2030">2030</option>
                        <option value="2031">2031</option>
                        <option value="2032">2032</option>
                        <option value="2033">2033</option>
                        <option value="2034">2034</option>
                        <option value="2035">2035</option>
                    </select>                   

                    <label for="cvv">CVV: *</label>
                    <input type="password" id="cvv" name="cvv"
                        maxlength="4" pattern="[0-9]{3,4}"
                        inputmode="numeric"
                        aria-describedby="cvv-hint" required>
                    <p id="cvv-hint">3 or 4 digits on the back of your card</p>
                </fieldset>
                
                <fieldset>
                    <legend>Order Notes</legend>

                    <label for="order-notes">Additional notes:</label>
                    <textarea id="order-notes" name="order-notes"
                            maxlength="500" rows="4" cols="40"></textarea>
                </fieldset>               

                <button type="submit">Place Order</button>
                <button type="reset">Reset</button>

            </form>
        </main>
    </body>
</html>
