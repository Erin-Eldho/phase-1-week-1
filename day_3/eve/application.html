<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Application</title>
    </head>
    <body>
        <main>
            <h1>Job Application - Unicron Innovations</h1>

            <ol>
                <li aria-current="step">Step 1: Personal Information</li>
                <li>Step 2: Work Experience</li>
                <li>Step 3: Documents</li>
            </ol>

            <form action="#" method="post" enctype="multipart/form-data">

                <fieldset>
                    <legend>Step 1: Personal Information</legend>

                    <label for="name">Full Name: *</label>
                    <input type="text" id="name" name="name" required>                    

                    <label for="email">Email: *</label>
                    <input type="email" id="email" name="email"
                        autocomplete="email" required>                    

                    <label for="phone">Phone: *</label>
                    <input type="tel" id="phone" name="phone"
                        autocomplete="tel" required>                    

                    <label for="linkedin">LinkedIn URL:</label>
                    <input type="url" id="linkedin" name="linkedin">
                    
                </fieldset>

                <fieldset>
                    <legend>Step 2: Work Experience</legend>

                    <label for="current-role">Current Role:</label>
                    <input type="text" id="current-role" name="current-role">                    

                    <label for="current-company">Current Company:</label>
                    <input type="text" id="current-company"
                        name="current-company">
                    
                    <label for="experience">Years of Experience: *</label>
                    <input type="number" id="experience" name="experience"
                        min="0" max="50" required>
                    
                    <label for="achievements">Key Achievements:</label>
                    <p id="achievements-hint">Max 500 characters</p>
                    <textarea id="achievements" name="achievements"
                            rows="5" cols="40" maxlength="500"
                            aria-describedby="achievements-hint"></textarea>
                    
                </fieldset>
               
                <fieldset>
                    <legend>Step 3: Documents</legend>

                    <label for="cv">Upload CV (PDF or DOCX): *</label>
                    <input type="file" id="cv" name="cv"
                        accept=".pdf,.docx" required>
                    
                    <label for="cover-letter">Upload Cover Letter:</label>
                    <input type="file" id="cover-letter"
                        name="cover-letter"
                        accept=".pdf,.doc,.docx">
                    
                    <label for="portfolio">Portfolio URL:</label>
                    <input type="url" id="portfolio" name="portfolio">
                    
                </fieldset>

                <button type="submit">Submit Application</button>
                <button type="reset">Reset</button>

            </form>
        </main>
    </body>
</html>
